short_bio: >-
  <p>
    My current research focuses on Medical <u>M</u>ultimodal <u>L</u>arge <u>L</u>anguage <u>M</u>odel (<i>MLLM</i>), particularly evidence-based medicine and biosignal analysis (e.g., ECG/EEG), under the supervision of Professor Benyou Wang. During my undergraduate studies, I was a visiting student at the Westlake University Center for Advanced Neural Chips, where I studied under Academician Mohamed Sawan. I am also an active contributor to the open-source community, with pull requests to renowned projects such as Areal, EasyR1, and VLM-R1. Several of my algorithm implementations have been stably adopted by large-tech companies, and the projects I have contributed to have collectively garnered thousands of stars.
  </p>
  <p>
    <span style="color: red;">I am seeking PhD opportunity, feel free to contact me.</span>
  </p>

