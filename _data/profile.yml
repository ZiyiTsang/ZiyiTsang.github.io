  <p>
    我目前的研究专注于医疗<u>M</u>ultimodal <u>L</u>arge <u>L</u>anguage <u>M</u>odel (<i>MLLM</i>)，特别是在法医学和生物信号分析（如ECG/EEG）领域的应用，师从<a href="https://sds.cuhk.edu.cn/en/teacher/571" target="_blank">王本友教授</a>。本科期间，我有幸作为访问学生进入西湖大学Cenbrain实验室，在<a href="https://en.westlake.edu.cn/faculty/mohamad-sawan.html" target="_blank">Mohamed Sawan教授</a>的指导下进行研究。我也是开源社区的积极贡献者，曾为Areal等知名项目提交代码。我的本科毕业论文由<a href="https://simkuangoh.github.io/" target="_blank">吴思权博士</a>指导。
