short_bio: >-
  <p>
    My current research focuses on Medical <u>M</u>ultimodal <u>L</u>arge <u>L</u>anguage <u>M</u>odels (<i>MLLMs</i>), with particular applications in forensic medicine and biosignal analysis (e.g., ECG/EEG), under the supervision of <a href="https://sds.cuhk.edu.cn/en/teacher/571" target="_blank">Prof. Wang Benyou</a>. During my undergraduate studies, I was honored to be admitted as a visiting student in the Cenbrain Lab at Westlake University, where I worked under the supervision of <a href="https://en.westlake.edu.cn/faculty/mohamad-sawan.html" target="_blank">Prof. Mohamed Sawan</a>. I am also an active contributor to the open-source community, with pull requests to renowned projects such as Areal. My bachelor's thesis was supervised by <a href="https://simkuangoh.github.io/" target="_blank">Dr. Goh Sim Kuan</a>.
  </p>
  <p>
    <span style="color: red;">I am currently seeking PhD/Intern opportunities.  Feel free to drop me an email.</span>
  </p>

