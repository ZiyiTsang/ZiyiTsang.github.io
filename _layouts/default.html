<!DOCTYPE html>
<html lang="en">
<!-- Template: https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="author" content="{{ site.data.profile.primary_name }}">
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% else %}
    <meta name="description" content="{{ site.data.profile.primary_name }} - {{ site.data.profile.positions[0].name }} at {{ site.data.profile.positions[1].name }}. Research focus on Medical Multimodal Large Language Models (MLLMs), forensic medicine and biosignal analysis.">
    {% endif %}
    <meta name="keywords" content="{{ site.data.profile.primary_name }}, ZENG Ziyi, Ziyi Zeng, Ziyi Tsang, Ziyitsang, Ziyi ZENG, ZENG Ziyi Tsang, 曾子懿, Artificial Intelligence, Robotics, Medical MLLM, Forensic Medicine, Biosignal Analysis, CUHK-SZ, Westlake University, EEG, Multimodal Learning, Medical AI, Neuroscience">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
    <meta property="og:description" content="{{ site.data.profile.primary_name }} - {{ site.data.profile.positions[0].name }} at {{ site.data.profile.positions[1].name }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}/{{ site.data.profile.portrait_url }}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
    <meta name="twitter:description" content="{{ site.data.profile.primary_name }} - {{ site.data.profile.positions[0].name }} at {{ site.data.profile.positions[1].name }}">
    <meta name="twitter:image" content="{{ site.url }}/{{ site.data.profile.portrait_url }}">

    <!-- Structured Data for Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ site.data.profile.primary_name }}",
      "alternateName": ["{{ site.data.profile.secondary_name }}", "Ziyi Tsang", "Ziyitsang", "Ziyi ZENG"],
      "jobTitle": "{{ site.data.profile.positions[0].name }}",
      "worksFor": {
        "@type": "Organization",
        "name": "{{ site.data.profile.positions[1].name }}"
      },
      "alumniOf": [
        {
          "@type": "Organization",
          "name": "Chinese University of Hong Kong, Shenzhen (CUHK-SZ)"
        },
        {
          "@type": "Organization",
          "name": "Xiamen University Malaysia (XMUM)"
        }
      ],
      "email": "{{ site.data.profile.email }}",
      "image": "{{ site.url }}/{{ site.data.profile.portrait_url }}",
      "url": "{{ site.url }}",
      "sameAs": [
        "https://scholar.google.com/citations?user={{ site.data.profile.gscholar }}",
        "https://github.com/{{ site.data.profile.github }}",
        "https://ziyitsang.github.io"
      ],
      "knowsAbout": [
        "Medical Multimodal Large Language Models",
        "Forensic Medicine",
        "Biosignal Analysis",
        "Artificial Intelligence",
        "Robotics",
        "EEG",
        "Machine Learning"
      ]
    }
    </script>

    <!-- Structured Data for Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "{{ site.title }}",
      "description": "{{ site.description }}",
      "url": "{{ site.url }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      },
      "publisher": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      },
      "inLanguage": "en"
    }
    </script>

    <!-- Page-specific structured data -->
    {% if page.title == "Publications" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Publications - {{ site.data.profile.navbar_name }}",
      "description": "Academic publications by {{ site.data.profile.primary_name }}",
      "url": "{{ site.url }}/publications.html",
      "author": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      }
    }
    </script>
    {% elsif page.title == "Projects, Experience & Awards" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Projects, Experience & Awards - {{ site.data.profile.navbar_name }}",
      "description": "Projects, experience and awards of {{ site.data.profile.primary_name }}",
      "url": "{{ site.url }}/projects_experience.html",
      "author": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      }
    }
    </script>
    {% elsif page.title == "Homepage" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Homepage - {{ site.data.profile.navbar_name }}",
      "description": "{{ site.description }}",
      "url": "{{ site.url }}/",
      "author": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      },
      "mainEntity": {
        "@type": "Person",
        "name": "{{ site.data.profile.primary_name }}"
      }
    }
    </script>
    {% endif %}

    <!-- International SEO Tags -->
    <link rel="alternate" hreflang="en" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="en-us" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="en-gb" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="zh" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="zh-cn" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="zh-tw" href="{{ site.url }}/" />
    <link rel="alternate" hreflang="zh-hk" href="{{ site.url }}/" />
    
    <!-- Regional Targeting -->
    <meta name="geo.region" content="CN" />
    <meta name="geo.region" content="HK" />
    <meta name="geo.placename" content="Shenzhen" />
    <meta name="geo.position" content="22.5431;114.0579" />
    <meta name="content-language" content="en,zh" />
    <meta name="target-country" content="CN,HK,US,GB" />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="{{ '/assets/css/global.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ '/assets/css/performance-optimizations.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ site.data.profile.portrait_url }}" as="image">
    
    <!-- DNS Prefetch for External Domains -->
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/performance-optimizations.css' | relative_url }}">
</head>
<body class="bg-light" {{ page.body_attr }}>
    {% include navbar.html %}
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        {{content}}
    </div>
    {% include footer.html %}

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/github-buttons/2.14.2/buttons.min.js" integrity="sha512-OYwZx04hKFeFNYrWxIyo3atgGpb+cxU0ENWBZs72X7T9U+NoHPM1ftUn/Mfw7dRDXrqWA6M1wBg6z6fGE32aeA==" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
              ],
              throwOnError : false
            });
        });
    </script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
    <!-- Busuanzi Count Script -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
